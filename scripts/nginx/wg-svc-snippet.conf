# nginx snippet for routing wg-mac control plane traffic to wg-svc
# (the standalone plugin binary). Drop this BEFORE the general
# `location /api { ... }` + `location /v1 { ... }` blocks in your
# vhost — more-specific matches win per nginx's location rules.
#
# Phase 1-D-2 cutover. Pair with POLAR_WG_REMOTE=true in dock's env
# so dock skips wg route registration (belt-and-braces — if nginx
# somehow misses the explicit blocks below, dock returns 404 instead
# of accidentally serving stale wg_* data from `ideamesh`).
#
# Roll back by removing this snippet + unsetting POLAR_WG_REMOTE.
#
# Example layout:
#
#   server {
#     server_name zen.example.com;
#     listen 443 ssl;
#     # ... ssl_certificate / root / etc ...
#
#     include /opt/homebrew/etc/nginx/snippets/wg-svc.conf;       # this file
#     include /opt/homebrew/etc/nginx/snippets/llm-proxy.conf;
#     location /api { proxy_pass http://127.0.0.1:8080; ... }     # dock
#     location /v1  { proxy_pass http://127.0.0.1:8080; ... }     # dock fallback
#     # ... rest of vhost ...
#   }

# ── /v1/* — device-facing join protocol ────────────────────────────
# /v1/register, /v1/peers, /v1/hub/peers, /v1/dns/*, /v1/heartbeat,
# /v1/leave, /v1/token/refresh, /v1/install[/version], /v1/bundle[/version].
# nginx's location prefix matching means /v1/register matches before
# any /v1/* fallback you might have for dock.

location ~ ^/v1/(register|peers|hub/peers|dns|heartbeat|leave|token/refresh|install|bundle) {
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host              $host;
    # $http_host, NOT $host: $host drops the port, and /v1/install bakes this
    # value into the script it generates as SERVER=. The control plane answers
    # on :2443 externally, so a portless SERVER pointed every installer at
    # :443 — which serves nothing — and the bundle download hung until it
    # timed out. Every join has needed a hand-patched script because of it.
    #
    # Setting it here also closes a hole: the handler reads X-Forwarded-Host
    # and nginx was passing the client's own value straight through, so a
    # caller could aim the generated installer at any host it liked.
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_http_version 1.1;

    # /v1/bundle/:version may return tens of MB (wg-mac tarball).
    # Lift the read timeout so slow links don't 504.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_max_body_size 200m;
}

# ── /api/admin/wg-* — admin CRUD ───────────────────────────────────
# wg-svc's requireAdminViaDock middleware extracts Authorization →
# calls dock's /internal/v1/auth/verify (30s SDK-cached) → enforces
# role=admin. No cookie session forwarded; the Bearer token from the
# UI is what gets verified.

location ^~ /api/admin/wg-hubs {
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host              $host;
    proxy_http_version 1.1;
}
location ^~ /api/admin/wg-tokens {
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host              $host;
    proxy_http_version 1.1;
}
location ^~ /api/admin/wg-devices {
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host              $host;
    proxy_http_version 1.1;
}
location ^~ /api/admin/wg-sites {
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host              $host;
    proxy_http_version 1.1;
}
location ^~ /api/admin/wg-bundles {
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host              $host;
    proxy_http_version 1.1;
    # Bundle UPLOAD can be a 50-200MB tarball. Allow it.
    client_max_body_size 200m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
# Catch-all for every OTHER /api/admin/wg-* route (wg-hub-links + any future
# admin endpoint) so ALL wg admin is served by polar-wg, never the dock copy.
# The longer-prefix blocks above still win for their special directives.
location ^~ /api/admin/wg- {
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host              $host;
    proxy_http_version 1.1;
}
